[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "covid-trabalho-remoto"
version = "1.0.0"
description = "Análise econométrica da relação entre ensino superior e trabalho remoto no Brasil durante a pandemia da COVID-19 (PNAD Covid-19, mai-nov/2020)."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Matheus de Souza Brasil" }
]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "statsmodels>=0.14",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "geopandas>=0.14",
    "geobr>=0.2",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
